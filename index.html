<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inasci games</title>
    

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="no_select">

<main>


    <!-- ==================================================
         ゲーム選択画面
    ================================================== -->

    <section
        id="menuScreen"
        class="menu-screen"
    >

        <div class="menu-content">

            <h1>
                Inasci games
            </h1>

           <p>Ver 2.0.1</p>


            <div class="game-select-buttons">

                <button
                    id="game1Button"
                    class="game-select-button"
                >
                    <span class="game-icon">
                        
                    </span>

                    <span>
                        刹那の会計
                    </span>
                   
                </button>


                <button
                    id="game2Button"
                    class="game-select-button"
                >
                    <span class="game-icon">
                        
                    </span>

                    <span>
                        けたごち
                    </span>
                </button>

            </div>

        </div>

    </section>



    <!-- ==================================================
         ゲーム1「刹那の会計」
         設定画面
    ================================================== -->

    <section
        id="game1SetupPage"
        class="hidden"
    >

        <h2>
            刹那の会計
        </h2>


        <form id="setupForm">

            <label for="playerCount">
                人数：
            </label>

            <select id="playerCount">

                <option value="2">
                    2人
                </option>

                <option value="3">
                    3人
                </option>

                <option value="4">
                    4人
                </option>

                <option value="5">
                    5人
                </option>

                <option value="6">
                    6人
                </option>

            </select>


            <label for="customNumber">
                数字（5桁まで）：
            </label>

            <input
                type="number"
                id="customNumber"
                maxlength="5"
                max="99999"
                min="0"
                placeholder="数字を入力"
            >


            <button
                type="submit"
                id="goGameBtn"
            >
                ゲーム開始
            </button>


            <button
                type="button"
                id="game1BackButton"
                class="menu-back-button"
            >
                ← ゲーム選択に戻る
            </button>

        </form>

    </section>



    <!-- ==================================================
         ゲーム1
         ゲーム画面
    ================================================== -->

    <section
        id="game1Page"
        class="hidden"
    >

        <button
            id="backToSetupBtn"
        >
            設定画面に戻る
        </button>


        <div class="center-area">

            <div
                class="col"
                id="leftCol"
            ></div>


            <div
                class="time"
                id="timeText"
            >

                <img
                    id="timeImage"
                    src="time.png"
                    alt="Time Image"
                >

            </div>


            <div
                class="col"
                id="rightCol"
            ></div>

        </div>

    </section>



    <!-- ==================================================
         ゲーム2
         入力画面
    ================================================== -->

    <section
        id="game2InputScreen"
        class="game2-screen hidden"
    >

        <div class="game2-container">

            <header class="game2-header">

                <h1>
                    けたごち
                </h1>

                <p>
                    桁ごとに割り振るよ！
                </p>

            </header>


            <div class="game2-card">


                <!-- 参加人数 -->

                <div class="game2-form-group">

                    <label for="participantCount">
                        人数
                    </label>

                    <input
                        type="number"
                        id="participantCount"
                        min="2"
                        max="20"
                        value="2"
                    >

                </div>


                <!-- 参加者 -->

                <div class="game2-form-group">

                    <label>
                        ユーザネーム
                    </label>

                    <div
                        id="participants"
                    ></div>

                </div>


                <!-- 合計金額 -->

                <div class="game2-form-group">

                    <label for="totalAmount">
                        合計金額
                    </label>

                    <div class="amount-input">

                        <span>
                            ¥
                        </span>

                        <input
                            type="number"
                            id="totalAmount"
                            min="1"
                            placeholder="例：1234"
                        >

                    </div>

                </div>


                <p
                    id="errorMessage"
                    class="game2-error-message"
                ></p>


                <button
                    id="startButton"
                    class="game2-start-button"
                >
                    ゲーム開始 ▶
                </button>


                <button
                    id="game2BackButton"
                    class="game2-back-button"
                >
                    ← ゲーム選択に戻る
                </button>

            </div>

        </div>

    </section>



    <!-- ==================================================
         ゲーム2
         ゲーム画面
    ================================================== -->

    <section
        id="game2Screen"
        class="game2-screen hidden"
    >

        <div class="game2-container">

            <div class="game2-card game2-game-card">

                <h1>
                    
                </h1>


                <div class="game2-total">

                    <p>
                        
                    </p>


                    <div
                        id="digitContainer"
                        class="digit-container"   
                    >
                    </div>


                    

                </div>


                <button
                    id="actionButton"
                    class="game2-start-button"
                >
                    スタート
                </button>


                <!-- RESULT -->

                <section
                    id="resultScreen"
                    class="result-screen hidden"
                >

                    <h2>
                        RESULT
                    </h2>

                    <div
                        id="resultList"
                    ></div>

                </section>

            </div>

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
